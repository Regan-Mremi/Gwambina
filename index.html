<!-- Certifications -->
<div class="text-center mt-5 pt-4" data-aos="fade-up">

  <span class="text-danger text-uppercase fw-semibold small">
    Certifications & Standards
  </span>

  <h2 class="fw-bold mt-2 mb-4">
    Committed to International Standards
  </h2>

  <div class="row justify-content-center g-4">

    <!-- ISO 22000 -->
    <div class="col-6 col-md-3">
      <div class="bg-white rounded shadow-sm p-4 h-100">
        <i class="bi bi-patch-check-fill text-danger fs-1 mb-3"></i>
        <h3 class="h5 fw-bold">ISO 22000</h3>
        <p class="text-muted small mb-0">
          Food Safety Management System
        </p>
      </div>
    </div>

    <!-- ISO 9001 -->
    <div class="col-6 col-md-3">
      <div class="bg-white rounded shadow-sm p-4 h-100">
        <i class="bi bi-award-fill text-danger fs-1 mb-3"></i>
        <h3 class="h5 fw-bold">ISO 9001</h3>
        <p class="text-muted small mb-0">
          Quality Management System
        </p>
      </div>
    </div>

    <!-- ISO 14001 -->
    <div class="col-6 col-md-3">
      <div class="bg-white rounded shadow-sm p-4 h-100">
        <i class="bi bi-tree-fill text-success fs-1 mb-3"></i>
        <h3 class="h5 fw-bold">ISO 14001</h3>
        <p class="text-muted small mb-0">
          Environmental Management System
        </p>
      </div>
    </div>

    <!-- ISO 45001 -->
    <div class="col-6 col-md-3">
      <div class="bg-white rounded shadow-sm p-4 h-100">
        <i class="bi bi-shield-check text-primary fs-1 mb-3"></i>
        <h3 class="h5 fw-bold">ISO 45001</h3>
        <p class="text-muted small mb-0">
          Occupational Health & Safety
        </p>
      </div>
    </div>

  </div>
</div>
